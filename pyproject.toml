[build-system]
    requires = ["setuptools", "wheel"]
    build-backend = "setuptools.build_meta"

[project]
    name = "dee"
    version = "0.1.0"
    description = "Versioning tool made with love"
    authors = [
        { name = "Wendrew Oliveira", email = "developer.wendrew@gmail.com"}
    ]
    requires-python = ">=3.11"
    dependencies = [
        "click>=8.1.8",
        "ipython>=9.2.0",
        "msgpack>=1.1.0",
        "numba>=0.61.2",
        "numpy>=2.2.4",
        "psycopg2-binary",
        "paramiko",
        "requests"
    ]

[project.scripts]
    dee = "dee.cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
    where = ["src"]